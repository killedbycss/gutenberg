<!doctype html>
<html lang="ru" data-browser-only="true">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гутенберг</title>
  <link rel="icon" type="image/x-icon" href="./github-pages/favicon.ico" />
  <style>
    @font-face { font-family: 'PT Root UI'; src: url('./github-pages/assets/pt-root-ui_regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'PT Root UI'; src: url('./github-pages/assets/pt-root-ui_medium.woff2') format('woff2'); font-weight: 500 600; font-display: swap; }
    @font-face { font-family: 'PT Root UI'; src: url('./github-pages/assets/pt-root-ui_bold.woff2') format('woff2'); font-weight: 700 900; font-display: swap; }
    :root {
      /* Минимальная палитра в духе Notion: почти монохром + один сдержанный синий */
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f5f5f4;
      --border: #e9e9e7;
      --text: #37352f;
      --muted: #9b9a97;
      --primary: #2f80ed;
      --primary-ink: #ffffff;
      --radius: 8px;
      --font: 'PT Root UI', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --surface: #1f1f1f;
        --surface-2: #2a2a2a;
        --border: #373737;
        --text: #e6e6e4;
        --muted: #8f8f8c;
        --primary: #4a9eea;
        --primary-ink: #ffffff;
      }
    }
    html[data-theme="light"] { --bg:#fff; --surface:#fff; --surface-2:#f5f5f4; --border:#e9e9e7; --text:#37352f; --muted:#9b9a97; --primary:#2f80ed; }
    html[data-theme="dark"] { --bg:#191919; --surface:#1f1f1f; --surface-2:#2a2a2a; --border:#373737; --text:#e6e6e4; --muted:#8f8f8c; --primary:#4a9eea; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- Верхняя панель (воркспейсы) ---------- */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .brand { display: flex; align-items: center; gap: 8px; padding-right: 6px; }
    .brand-icon { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .brand .wordmark { font-weight: 800; font-size: 17px; letter-spacing: -.02em; color: var(--text); }

    .tabs {
      display: flex; align-items: stretch; gap: 4px; height: 100%;
      min-width: 0; overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .menu-toggle { display: none; }
    .tab {
      appearance: none; border: 0; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 14px; font-weight: 500;
      padding: 0 11px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; position: relative; border-radius: 6px; margin: 7px 0;
      flex: 0 0 auto; white-space: nowrap;
      transition: background .12s ease, color .12s ease;
    }
    .tab:hover { background: var(--surface-2); color: var(--text); }
    .tab .kbd {
      font-size: 11px; color: var(--muted); border: 1px solid var(--border);
      border-radius: 4px; padding: 0 5px; line-height: 15px; margin-left: 1px;
    }
    .tab[aria-selected="true"] { color: var(--text); font-weight: 600; background: var(--surface-2); }
    .tab[aria-selected="true"] .kbd { color: var(--text); }

    .spacer { flex: 1 1 auto; }
    .actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      appearance: none; border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); border-radius: 6px; height: 30px; padding: 0 10px;
      font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: color .12s, background .12s, border-color .12s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-2); }
    .font-action { position: relative; }
    .font-btn-mark { font: 700 15px/1 Georgia, serif; }
    .font-status { position: absolute; top: 36px; right: 0; z-index: 20; width: 250px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,.16); font-size: 12px; line-height: 1.4; }
    .font-status[hidden] { display: none; }
    .font-status small { display: block; margin-top: 3px; color: var(--muted); }
    .support-pop { position: fixed; z-index: 50; top: 58px; right: 14px; width: min(360px, calc(100vw - 28px)); padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 14px 44px rgba(0,0,0,.18); color: var(--text); animation: pop-in .2s ease-out; }
    .support-pop[hidden] { display: none; }
    .support-pop strong { display: block; margin-bottom: 5px; }
    .support-pop p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

    /* ---------- Сцена с iframe ---------- */
    .stage { flex: 1 1 auto; position: relative; background: var(--bg); }
    .frame {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .12s ease;
    }
    .frame.active { opacity: 1; visibility: visible; pointer-events: auto; }

    .loader {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: var(--bg); color: var(--muted); font-size: 14px; gap: 10px;
      z-index: 2;
    }
    .loader.hidden { display: none; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--primary);
      animation: spin .8s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      .topbar { gap: 6px; padding: 0 8px; }
      .brand .wordmark { display: none; }
      .brand { padding-right: 0; }
      .menu-toggle { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font: 20px/1 var(--font); }
      .tabs { display: none; position: fixed; z-index: 45; top: 48px; left: 8px; right: 8px; height: auto; padding: 7px; flex-direction: column; align-items: stretch; overflow: visible; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: 0 14px 36px rgba(0,0,0,.18); }
      .tabs.open { display: flex; }
      .tab { min-height: 40px; padding: 0 11px; gap: 6px; margin: 0; }
      .tab .kbd { display: none; }
      .icon-btn .label { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="./github-pages/assets/studio-icon.png" alt="" />
      <div class="wordmark">Гутенберг</div>
    </div>

    <button class="menu-toggle" id="menu-toggle" aria-label="Открыть разделы" aria-expanded="false">☰</button>

    <nav class="tabs" role="tablist" aria-label="Модули">
      <button class="tab" role="tab" data-mod="spellcheck">Орфография <span class="kbd">⌥1</span></button>
      <button class="tab" role="tab" data-mod="typograph">Типограф <span class="kbd">⌥2</span></button>
      <button class="tab" role="tab" data-mod="converter">Конвертер <span class="kbd">⌥3</span></button>
      <button class="tab" role="tab" data-mod="layouts">Макеты <span class="kbd">⌥4</span></button>
      <button class="tab" role="tab" data-mod="bento">Бенто <span class="kbd">⌥5</span></button>
    </nav>

    <div class="spacer"></div>

    <div class="actions">
      <button class="icon-btn" id="support-button" title="Поддержать проект">♡ <span class="label">Поддержать</span></button>
      <div class="font-action">
        <button class="icon-btn" id="font-upload" title="Загрузить свой шрифт для интерфейса">
          <span class="font-btn-mark">Aa+</span> <span class="label">Шрифт</span>
        </button>
        <input id="font-input" type="file" hidden accept=".otf,.ttf,.ttc,.woff,.woff2" />
        <div class="font-status" id="font-status" hidden></div>
      </div>
      <button class="icon-btn" id="theme-toggle" title="Переключить тему">
        <span id="theme-icon">◐</span> <span class="label" id="theme-label">Тема</span>
      </button>
      <button class="icon-btn" id="open-standalone" title="Открыть активный модуль в отдельной вкладке">
        ↗ <span class="label">Отдельно</span>
      </button>
    </div>
  </header>
  <div class="support-pop" id="support-pop" role="status" hidden><strong>Спасибо!</strong><p>4 пакетика кофе стоят 100 рублей. Номер +79009498387 скопирован — по нему можно перевести.</p></div>

  <main class="stage" id="stage">
    <div class="loader" id="loader">
      <div>
        <div class="spinner"></div>
        Загрузка модуля…
      </div>
    </div>
    <!-- iframe создаются скриптом ниже -->
  </main>

  <script>
    (function () {
      var MODULES = ['spellcheck', 'typograph', 'converter', 'layouts', 'bento'];
      var BROWSER_ONLY = document.documentElement.getAttribute('data-browser-only') === 'true';
      var SITE_ROOT = BROWSER_ONLY ? './github-pages/' : '/';
      var LABELS = { spellcheck: 'Орфография', typograph: 'Типограф', converter: 'Конвертер', layouts: 'Макеты', bento: 'Бенто' };
      var LS_KEY = 'studio.activeModule';

      var stage = document.getElementById('stage');
      var loader = document.getElementById('loader');
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
      var tabsMenu = document.querySelector('.tabs');
      var menuToggle = document.getElementById('menu-toggle');
      var frames = {};
      var loaded = {};
      var THEME_KEY = 'studio.theme';
      var customFont = null;
      var theme = null;
      try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyTheme(next) {
        theme = next;
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀' : '☾';
        document.getElementById('theme-label').textContent = theme === 'dark' ? 'Светлая' : 'Тёмная';
        Object.keys(frames).forEach(function (mod) {
          try { frames[mod].contentDocument.documentElement.setAttribute('data-theme', theme); } catch (e) {}
        });
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
      }

      function injectFont(doc) {
        if (!customFont || !doc) return;
        var old = doc.getElementById('studio-custom-font');
        if (old) old.remove();
        var style = doc.createElement('style');
        style.id = 'studio-custom-font';
        style.textContent = customFont.css + '\n:root{--font:\'StudioCustom\',sans-serif}';
        doc.head.appendChild(style);
      }

      function applyCustomFont(payload) {
        var format = payload.outputs.woff2 ? 'woff2' : 'woff';
        var mime = format === 'woff2' ? 'font/woff2' : 'font/woff';
        var source = payload.outputs[format];
        customFont = {
          family: payload.family,
          css: '@font-face{font-family:\'StudioCustom\';src:url(data:' + mime + ';base64,' + source + ') format(\'' + format + '\');font-display:swap;}'
        };
        var own = document.getElementById('studio-custom-font');
        if (own) own.remove();
        own = document.createElement('style'); own.id = 'studio-custom-font';
        own.textContent = customFont.css + '\n:root{--font:\'StudioCustom\',sans-serif}';
        document.head.appendChild(own);
        Object.keys(frames).forEach(function (mod) {
          try { injectFont(frames[mod].contentDocument); } catch (e) {}
        });
      }

      function applyRawFont(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onerror = function () { reject(new Error('Не удалось прочитать файл шрифта')); };
          reader.onload = function () {
            var ext = (file.name.split('.').pop() || '').toLowerCase();
            var format = ext === 'woff2' ? 'woff2' : ext === 'woff' ? 'woff' : ext === 'otf' ? 'opentype' : 'truetype';
            customFont = {
              family: file.name.replace(/\.[^.]+$/, ''),
              css: '@font-face{font-family:\'StudioCustom\';src:url(' + reader.result + ') format(\'' + format + '\');font-display:swap;}'
            };
            var own = document.getElementById('studio-custom-font');
            if (own) own.remove();
            own = document.createElement('style'); own.id = 'studio-custom-font';
            own.textContent = customFont.css + '\n:root{--font:\'StudioCustom\',\'PT Root UI\',sans-serif}';
            document.head.appendChild(own);
            Object.keys(frames).forEach(function (mod) {
              try { injectFont(frames[mod].contentDocument); } catch (e) {}
            });
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }
      applyTheme(theme);

      // Создаём оболочки iframe сразу, но src назначаем при первом открытии.
      // Так слабое соединение не скачивает все модули одновременно, а уже
      // открытые разделы сохраняют состояние при переключении.
      MODULES.forEach(function (mod) {
        if (mod === 'bento') { frames.bento = frames.layouts; loaded.bento = loaded.layouts; return; }
        var f = document.createElement('iframe');
        f.className = 'frame';
        f.title = LABELS[mod];
        f.setAttribute('data-src', SITE_ROOT + 'app/' + mod + '/');
        f.setAttribute('data-mod', mod);
        f.addEventListener('load', function () {
          loaded[mod] = true;
          if (mod === 'layouts') loaded.bento = true;
          try { f.contentDocument.documentElement.setAttribute('data-theme', theme); } catch (e) {}
          try { injectFont(f.contentDocument); } catch (e) {}
          if (mod === 'layouts') {
            [0, 120, 400].forEach(function (delay) { setTimeout(function () {
              try { f.contentWindow.postMessage({ type: 'studio-mode', mode: active === 'bento' ? 'bento' : 'editor' }, '*'); } catch (e) {}
            }, delay); });
          }
          updateLoader();
        });
        stage.appendChild(f);
        frames[mod] = f;
      });

      var active = null;

      function updateLoader() {
        loader.classList.toggle('hidden', !!loaded[active]);
      }

      function activate(mod) {
        if (MODULES.indexOf(mod) === -1) mod = MODULES[0];
        active = mod;
        var targetFrame = frames[mod];
        if (!targetFrame.getAttribute('src')) targetFrame.setAttribute('src', targetFrame.getAttribute('data-src'));
        Array.from(new Set(Object.keys(frames).map(function (m) { return frames[m]; }))).forEach(function (frame) { frame.classList.remove('active'); });
        frames[mod].classList.add('active');
        if (mod === 'layouts' || mod === 'bento') {
          try { frames.layouts.contentWindow.postMessage({ type: 'studio-mode', mode: mod === 'bento' ? 'bento' : 'editor' }, '*'); } catch (e) {}
        }
        tabs.forEach(function (t) {
          t.setAttribute('aria-selected', String(t.getAttribute('data-mod') === mod));
        });
        document.title = LABELS[mod] + ' — Гутенберг';
        try { localStorage.setItem(LS_KEY, mod); } catch (e) {}
        updateLoader();
      }

      tabs.forEach(function (t) {
        t.addEventListener('click', function () { activate(t.getAttribute('data-mod')); tabsMenu.classList.remove('open'); menuToggle.setAttribute('aria-expanded', 'false'); });
      });
      menuToggle.addEventListener('click', function () { var open = tabsMenu.classList.toggle('open'); menuToggle.setAttribute('aria-expanded', String(open)); });

      // Горячие клавиши: Alt (⌥) + 1/2/3/4 — переключение воркспейсов.
      // Alt, а не ⌘/Ctrl: ⌘/Ctrl+цифра в браузере переключает вкладки браузера.
      // Проверяем e.code (Digit1…), т.к. Alt+цифра на macOS даёт спецсимвол в e.key.
      window.addEventListener('keydown', function (e) {
        if (!e.altKey || e.metaKey || e.ctrlKey) return;
        var i = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].indexOf(e.code);
        if (i !== -1) { e.preventDefault(); activate(MODULES[i]); }
      });

      document.getElementById('open-standalone').addEventListener('click', function () {
        window.open(SITE_ROOT + 'app/' + (active === 'bento' ? 'layouts/?mode=bento' : active + '/'), '_blank');
      });
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'studio-activate' && MODULES.indexOf(event.data.mod) !== -1) activate(event.data.mod);
      });
      document.getElementById('support-button').addEventListener('click', async function () {
        var number = '+79009498387';
        try { await navigator.clipboard.writeText(number); } catch (e) {
          var area = document.createElement('textarea'); area.value = number; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove();
        }
        var pop = document.getElementById('support-pop'); pop.hidden = false;
        clearTimeout(window.__supportTimer); window.__supportTimer = setTimeout(function () { pop.hidden = true; }, 5500);
      });
      document.getElementById('theme-toggle').addEventListener('click', function () {
        applyTheme(theme === 'dark' ? 'light' : 'dark');
      });
      var fontInput = document.getElementById('font-input');
      var fontStatus = document.getElementById('font-status');
      document.getElementById('font-upload').addEventListener('click', function () { fontInput.click(); });
      fontInput.addEventListener('change', async function () {
        var file = fontInput.files && fontInput.files[0];
        if (!file) return;
        fontStatus.hidden = false;
        fontStatus.innerHTML = 'Загружаю шрифт…<small>Затем оптимизирую через встроенный конвертер</small>';
        var form = new FormData(); form.append('font', file, file.name);
        try {
          await applyRawFont(file);
          if (BROWSER_ONLY) {
            fontStatus.innerHTML = '<b>' + file.name.replace(/[<>&]/g, '') + '</b><small>Шрифт применён локально в браузере</small>';
            setTimeout(function () { fontStatus.hidden = true; }, 3500);
            return;
          }
          fontStatus.innerHTML = '<b>' + file.name.replace(/[<>&]/g, '') + '</b><small>Применён · готовлю WOFF2/WOFF…</small>';
          var response = await fetch('/converter/api/webfont', { method: 'POST', body: form });
          var payload = await response.json();
          if (!response.ok) throw new Error(payload.error || 'Не удалось преобразовать шрифт');
          applyCustomFont(payload);
          fontStatus.innerHTML = '<b>' + payload.family.replace(/[<>&]/g, '') + '</b><small>Шрифт применён к панели и всем разделам</small>';
          setTimeout(function () { fontStatus.hidden = true; }, 3500);
        } catch (error) {
          fontStatus.innerHTML = '<b>Шрифт применён локально</b><small>Оптимизация недоступна: ' + String(error.message).replace(/[<>&]/g, '') + '</small>';
          setTimeout(function () { fontStatus.hidden = true; }, 5000);
        } finally {
          fontInput.value = '';
        }
      });

      // Восстанавливаем последнюю активную вкладку.
      var saved = null;
      try { saved = localStorage.getItem(LS_KEY); } catch (e) {}
      activate(saved || MODULES[0]);
    })();
  </script>
</body>
</html>
